[package]
name = "torrent-name-parser"
description = "Torrent name metadata parser"
license = "MIT"
version = "0.9.0"
authors = ["IGI-111 <igi-111@protonmail.com>"]
edition = "2018"
repository = "https://github.com/IGI-111/torrent-name-parser"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1.2.1"
lazy_static = "1.3"
bitflags = "2.6.0"
thiserror = "2.0.16"
result = "1.0.0"
compact_str = "0.9.0"
cervine = "0.0.6"
phf = { version = "0.13.1", features = ["macros"] }

[dev-dependencies]
criterion = "0.7.0"
criterion-macro = "0.4.0"

[[bench]]
name = "benchmark"
harness = false

